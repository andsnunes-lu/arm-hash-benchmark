# GitHub Actions workflow: run the hash benchmark on a free ARM64 runner.
# Put this file in a PUBLIC repo at .github/workflows/hash-benchmark-arm64.yml
# together with jetson_hash_benchmark.sh at the repo root.
# The repo should contain ONLY these two files (no SDP code).
# Run it from the "Actions" tab > "Hash benchmark ARM64" > "Run workflow".

name: Hash benchmark ARM64

on:
  workflow_dispatch:

jobs:
  bench:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y b3sum openssl || true
          if ! command -v b3sum >/dev/null; then
            cargo install b3sum
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          fi
          lscpu

      - name: Run benchmark
        run: |
          chmod +x jetson_hash_benchmark.sh
          sudo ./jetson_hash_benchmark.sh

      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: hash-benchmark-results
          path: results_*.txt
